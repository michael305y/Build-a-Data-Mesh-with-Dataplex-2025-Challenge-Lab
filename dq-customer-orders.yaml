metadata_registry_defaults:
  dataplex:
    projects: qwiklabs-gcp-04-df41a3beb0d6
    locations: us-central1
    # lakes: Sales Lake
    lakes: sales-lake
    # zones: Raw Customer Zone
    zones: curated-customer-zone

row_filters:
  NONE:
    filter_sql_expr: |-
      True
  INTERNATIONAL_ITEMS:
    filter_sql_expr: |-
      REGEXP_CONTAINS(item_id, 'INTNL')

rule_dimensions:
  - consistency
  - correctness
  - duplication
  - completeness
  - conformance
  - integrity
  - timeliness
  - accuracy

rules:
  NOT_NULL:
    rule_type: NOT_NULL
    dimension: completeness

rule_bindings:
  NOT_NULL_USER_ID:
    entity_uri: bigquery://projects/qwiklabs-gcp-04-df41a3beb0d6/datasets/customer_orders/tables/ordered_items
    column_id: user_id
    row_filter_id: NONE
    rule_ids:
      - NOT_NULL

  NOT_NULL_ORDER_ID:
    entity_uri: bigquery://projects/qwiklabs-gcp-04-df41a3beb0d6/datasets/customer_orders/tables/ordered_items
    column_id: order_id
    row_filter_id: NONE
    rule_ids:
      - NOT_NULL
